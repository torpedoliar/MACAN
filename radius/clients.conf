# Replaces the upstream clients.conf entirely — the "client localhost" block with
# secret testing123 is gone with it.
#
# Every client here is DYNAMIC: no IP or secret is listed. When a packet arrives
# from an address inside one of these networks, FreeRADIUS runs the
# `macan_clients` virtual server (radius/macan_clients.conf), which looks the
# source IP up in the `controllers` table and returns that row's shared secret.
# The client is then cached for `lifetime` seconds.
#
# This is what removes "docker compose restart radius" after adding a controller:
# rlm_sql's read_clients reads the table once at startup, dynamic clients read it
# per unknown source address. sql.conf therefore sets read_clients = no.
#
# Only RFC1918 plus loopback: a UniFi AP always has a private address. Widening
# this to 0.0.0.0/0 works, but then any host that can reach 1812/udp triggers a
# database lookup for its own IP. Add a block here if a NAS really is public.
#
# lifetime is the one knob with a trade-off:
#   - Registering a NEW controller takes effect immediately — no entry is cached
#     for that address yet, so the first packet does the lookup.
#   - Rotating a secret, changing an IP, disabling or deleting a controller takes
#     up to `lifetime` seconds, because the old entry is still cached. The AP
#     keeps working with the old secret until then; nothing goes down mid-window.
#   - FreeRADIUS adds at most ONE new client per second and that limit is not
#     configurable. After a radius restart every AP is cold, so a fleet of N APs
#     needs ~N seconds to be fully served again. Keep lifetime > N so steady-state
#     re-adds (N/lifetime per second) stay under that ceiling.
#
# ponytail: 300s is the whole mechanism. Need revocation to be instant instead?
# Enable sites-available/control-socket, share ${run_dir} with the web container,
# and have routes/controllers.js run `radmin -e "del client ipaddr <ip>"` — that
# flushes one entry immediately (verified). Not built: a 5-minute window on a
# manual admin action does not justify a shared socket between containers.

client macan_dynamic_10 {
	ipaddr = 10.0.0.0/8
	proto = *
	dynamic_clients = macan_clients
	lifetime = 300
}

client macan_dynamic_172 {
	ipaddr = 172.16.0.0/12
	proto = *
	dynamic_clients = macan_clients
	lifetime = 300
}

client macan_dynamic_192 {
	ipaddr = 192.168.0.0/16
	proto = *
	dynamic_clients = macan_clients
	lifetime = 300
}

# For `radclient 127.0.0.1:1812` from inside the container (see README). Register
# 127.0.0.1 as a controller first, exactly like a real NAS.
client macan_dynamic_loopback {
	ipaddr = 127.0.0.0/8
	proto = *
	dynamic_clients = macan_clients
	lifetime = 300
}
