server default {
    listen {
        type = auth
        ipaddr = *
        port = 0
        limit {
            max_connections = 16
            lifetime = 0
            idle_timeout = 30
        }
    }
    listen {
        type = acct
        ipaddr = *
        port = 0
        limit {
            max_connections = 16
            lifetime = 0
            idle_timeout = 30
        }
    }

    authorize {
        #
        # Normalise the MAC to aa:bb:cc:dd:ee:ff. UniFi sends colon-separated,
        # but other NASes send aabbccddeeff / aa-bb-cc-dd-ee-ff / aabb.ccdd.eeff,
        # and the old REPLACE-only version left those unmatchable. Strip every
        # separator, then re-insert colons. Non-12-hex input yields "".
        #
        # No brace quantifier in the regex: an unquoted closing brace ends the
        # surrounding %-sql expansion, so the query got truncated mid-string and
        # MariaDB answered ERROR 1064. CHAR_LENGTH plus a negated character class
        # says the same thing without a brace.
        #
        # Tmp-String-1 is read back from SQL and re-expanded into every query
        # below, so it passes through the escaper twice. That is only harmless
        # because mods-available/sql sets auto_escape = yes: MariaDB's escaping is
        # undone when the query is parsed, so the value round-trips verbatim. With
        # FreeRADIUS' default mime escaper an SSID "Guest & Co" would arrive as
        # "Guest =26 Co" and, on the second pass, "Guest =3D26 Co" — matching no
        # rule an operator could ever type.
        update request {
            Tmp-String-0 = "%{sql:SELECT CASE WHEN CHAR_LENGTH(h) = 12 AND h NOT REGEXP '[^0-9a-f]' THEN CONCAT_WS(':', SUBSTR(h,1,2), SUBSTR(h,3,2), SUBSTR(h,5,2), SUBSTR(h,7,2), SUBSTR(h,9,2), SUBSTR(h,11,2)) ELSE '' END FROM (SELECT LOWER(REPLACE(REPLACE(REPLACE('%{Calling-Station-Id}', '-', ''), ':', ''), '.', '')) AS h) AS n}"
            Tmp-String-1 = "%{sql:SELECT SUBSTRING_INDEX('%{Called-Station-Id}', ':', -1)}"
        }

        if ("%{Tmp-String-0}" == "") {
            update reply {
                Reply-Message = "Calling-Station-Id bukan MAC address yang valid"
            }
            reject
        }

        update control {
            Tmp-Integer-0 = "%{sql:SELECT id FROM controllers WHERE ip_address = '%{Packet-Src-IP-Address}' AND enabled = 1 LIMIT 1}"
        }
        if ("%{control:Tmp-Integer-0}" == "") {
            # Unknown or disabled NAS. controller_id stays NULL so the operator can
            # still see the attempt on the Auth Logs page.
            update control {
                Tmp-String-3 = "%{sql:INSERT INTO auth_logs (controller_id, ssid_name, mac_address, result, reason, raw_attrs) VALUES (NULL, '%{Tmp-String-1}', '%{Tmp-String-0}', 'reject', 'controller tidak dikenal atau nonaktif', JSON_OBJECT('nas_ip', '%{Packet-Src-IP-Address}', 'calling_station_id', '%{Calling-Station-Id}', 'called_station_id', '%{Called-Station-Id}', 'nas_port_id', '%{NAS-Port-Id}', 'user_name', '%{User-Name}'))}"
            }
            update reply {
                Reply-Message = "Unknown or disabled controller"
            }
            reject
        }

        #
        # Maintenance mode is fail-closed: while it is on, nothing new is
        # authorised. Sessions already up are unaffected (they don't re-auth).
        #
        update control {
            Tmp-String-4 = "%{sql:SELECT value FROM settings WHERE name = 'maintenance_mode' LIMIT 1}"
        }
        if ("%{control:Tmp-String-4}" == "1") {
            update control {
                Tmp-String-3 = "%{sql:INSERT INTO auth_logs (controller_id, ssid_name, mac_address, result, reason, raw_attrs) VALUES (%{control:Tmp-Integer-0}, '%{Tmp-String-1}', '%{Tmp-String-0}', 'reject', 'mode maintenance aktif', JSON_OBJECT('nas_ip', '%{Packet-Src-IP-Address}', 'calling_station_id', '%{Calling-Station-Id}', 'called_station_id', '%{Called-Station-Id}', 'nas_port_id', '%{NAS-Port-Id}', 'user_name', '%{User-Name}'))}"
            }
            update reply {
                Reply-Message = "Maintenance mode"
            }
            reject
        }

        # SSID inventory: auto-discovered SSIDs land disabled and must be
        # enabled by an operator before any MAC on them can authenticate.
        update control {
            Tmp-String-3 = "%{sql:INSERT INTO ssids (controller_id, ssid_name, enabled, auto_created, last_seen_at) VALUES (%{control:Tmp-Integer-0}, '%{Tmp-String-1}', 0, 1, NOW()) ON DUPLICATE KEY UPDATE last_seen_at = NOW()}"
        }

        update control {
            Tmp-Integer-1 = "%{sql:SELECT enabled FROM ssids WHERE controller_id = %{control:Tmp-Integer-0} AND ssid_name = '%{Tmp-String-1}' LIMIT 1}"
        }
        if ("%{control:Tmp-Integer-1}" != "1") {
            update control {
                Tmp-String-3 = "%{sql:INSERT INTO auth_logs (controller_id, ssid_name, mac_address, result, reason, raw_attrs) VALUES (%{control:Tmp-Integer-0}, '%{Tmp-String-1}', '%{Tmp-String-0}', 'reject', 'SSID nonaktif', JSON_OBJECT('nas_ip', '%{Packet-Src-IP-Address}', 'calling_station_id', '%{Calling-Station-Id}', 'called_station_id', '%{Called-Station-Id}', 'nas_port_id', '%{NAS-Port-Id}', 'user_name', '%{User-Name}'))}"
            }
            update reply {
                Reply-Message = "SSID disabled"
            }
            reject
        }

        #
        # Rule lookup in ONE query. The previous two-step version put the global
        # fallback inside a nested `if`, where an `update control` does not
        # refresh the outer %{control:...} value — so a global-only rule could be
        # read as "no rule". Precedence is expressed in ORDER BY instead:
        # controller-scoped first (controller_id IS NULL sorts as 1), then id for
        # a deterministic winner.
        #
        update control {
            Tmp-String-2 = "%{sql:SELECT status FROM mac_rules WHERE ssid_name = '%{Tmp-String-1}' AND mac_address = '%{Tmp-String-0}' AND (controller_id = %{control:Tmp-Integer-0} OR controller_id IS NULL) ORDER BY controller_id IS NULL ASC, id ASC LIMIT 1}"
        }

        if ("%{control:Tmp-String-2}" == "allow") {
            update control {
                Tmp-String-3 = "%{sql:INSERT INTO auth_logs (controller_id, ssid_name, mac_address, result, reason, raw_attrs) VALUES (%{control:Tmp-Integer-0}, '%{Tmp-String-1}', '%{Tmp-String-0}', 'accept', 'rule allow', JSON_OBJECT('nas_ip', '%{Packet-Src-IP-Address}', 'calling_station_id', '%{Calling-Station-Id}', 'called_station_id', '%{Called-Station-Id}', 'nas_port_id', '%{NAS-Port-Id}', 'user_name', '%{User-Name}'))}"
                Tmp-String-3 = "%{sql:UPDATE mac_rules SET last_seen_at = NOW() WHERE ssid_name = '%{Tmp-String-1}' AND mac_address = '%{Tmp-String-0}' AND (controller_id = %{control:Tmp-Integer-0} OR controller_id IS NULL)}"
            }
            accept
        }
        elsif ("%{control:Tmp-String-2}" == "deny") {
            update control {
                Tmp-String-3 = "%{sql:INSERT INTO auth_logs (controller_id, ssid_name, mac_address, result, reason, raw_attrs) VALUES (%{control:Tmp-Integer-0}, '%{Tmp-String-1}', '%{Tmp-String-0}', 'reject', 'rule deny', JSON_OBJECT('nas_ip', '%{Packet-Src-IP-Address}', 'calling_station_id', '%{Calling-Station-Id}', 'called_station_id', '%{Called-Station-Id}', 'nas_port_id', '%{NAS-Port-Id}', 'user_name', '%{User-Name}'))}"
            }
            update reply {
                Reply-Message = "MAC denied"
            }
            reject
        }
        elsif ("%{control:Tmp-String-2}" == "disabled") {
            update control {
                Tmp-String-3 = "%{sql:INSERT INTO auth_logs (controller_id, ssid_name, mac_address, result, reason, raw_attrs) VALUES (%{control:Tmp-Integer-0}, '%{Tmp-String-1}', '%{Tmp-String-0}', 'reject', 'rule disabled', JSON_OBJECT('nas_ip', '%{Packet-Src-IP-Address}', 'calling_station_id', '%{Calling-Station-Id}', 'called_station_id', '%{Called-Station-Id}', 'nas_port_id', '%{NAS-Port-Id}', 'user_name', '%{User-Name}'))}"
            }
            update reply {
                Reply-Message = "MAC rule disabled"
            }
            reject
        }
        else {
            # Default deny. This is the row the Approvals page picks up.
            update control {
                Tmp-String-3 = "%{sql:INSERT INTO auth_logs (controller_id, ssid_name, mac_address, result, reason, raw_attrs) VALUES (%{control:Tmp-Integer-0}, '%{Tmp-String-1}', '%{Tmp-String-0}', 'reject', 'rule tidak ditemukan', JSON_OBJECT('nas_ip', '%{Packet-Src-IP-Address}', 'calling_station_id', '%{Calling-Station-Id}', 'called_station_id', '%{Called-Station-Id}', 'nas_port_id', '%{NAS-Port-Id}', 'user_name', '%{User-Name}'))}"
            }
            update reply {
                Reply-Message = "No matching rule"
            }
            reject
        }
    }

    authenticate {
        Auth-Type Accept {
            accept
        }
    }

    accounting {
        update request {
            Tmp-String-0 = "%{sql:SELECT CASE WHEN CHAR_LENGTH(h) = 12 AND h NOT REGEXP '[^0-9a-f]' THEN CONCAT_WS(':', SUBSTR(h,1,2), SUBSTR(h,3,2), SUBSTR(h,5,2), SUBSTR(h,7,2), SUBSTR(h,9,2), SUBSTR(h,11,2)) ELSE '' END FROM (SELECT LOWER(REPLACE(REPLACE(REPLACE('%{Calling-Station-Id}', '-', ''), ':', ''), '.', '')) AS h) AS n}"
            Tmp-String-1 = "%{sql:SELECT SUBSTRING_INDEX('%{Called-Station-Id}', ':', -1)}"
        }
        update control {
            Tmp-Integer-0 = "%{sql:SELECT id FROM controllers WHERE ip_address = '%{Packet-Src-IP-Address}' LIMIT 1}"
        }
        if ("%{control:Tmp-Integer-0}" == "") {
            update control {
                Tmp-Integer-0 := "0"
            }
        }

        #
        # Only the event types accounting_logs.event_type accepts are inserted.
        # Accounting-On/Off arrive when a controller reboots; the old ENUM did not
        # list them, so those rows were silently dropped.
        #
        if ("%{Acct-Status-Type}" == "Start" || "%{Acct-Status-Type}" == "Stop" || "%{Acct-Status-Type}" == "Interim-Update" || "%{Acct-Status-Type}" == "Accounting-On" || "%{Acct-Status-Type}" == "Accounting-Off" || "%{Acct-Status-Type}" == "Failed") {
            update control {
                Tmp-String-3 = "%{sql:INSERT INTO accounting_logs (controller_id, ssid_name, mac_address, session_id, event_type) VALUES (NULLIF(%{control:Tmp-Integer-0}, 0), NULLIF('%{Tmp-String-1}', ''), NULLIF('%{Tmp-String-0}', ''), NULLIF('%{Acct-Session-Id}', ''), '%{Acct-Status-Type}')}"
            }
        }

        # A controller reboot invalidates every session it was tracking.
        if ("%{Acct-Status-Type}" == "Accounting-On" || "%{Acct-Status-Type}" == "Accounting-Off") {
            update control {
                Tmp-String-3 = "%{sql:UPDATE sessions SET stopped_at = NOW(), last_update_at = NOW() WHERE stopped_at IS NULL AND controller_id = NULLIF(%{control:Tmp-Integer-0}, 0)}"
            }
        }

        if ("%{Tmp-String-0}" != "" && "%{Acct-Session-Id}" != "") {
            if ("%{Acct-Status-Type}" == "Start" || "%{Acct-Status-Type}" == "Interim-Update") {
                update control {
                    Tmp-String-3 = "%{sql:INSERT INTO sessions (controller_id, ssid_name, mac_address, session_id, started_at, last_update_at) VALUES (NULLIF(%{control:Tmp-Integer-0}, 0), NULLIF('%{Tmp-String-1}', ''), '%{Tmp-String-0}', '%{Acct-Session-Id}', NOW(), NOW()) ON DUPLICATE KEY UPDATE last_update_at = NOW(), stopped_at = NULL}"
                }
            }
            if ("%{Acct-Status-Type}" == "Stop") {
                update control {
                    Tmp-String-3 = "%{sql:UPDATE sessions SET stopped_at = NOW(), last_update_at = NOW() WHERE session_id = '%{Acct-Session-Id}'}"
                }
            }
            update control {
                Tmp-String-3 = "%{sql:UPDATE mac_rules SET last_seen_at = NOW() WHERE mac_address = '%{Tmp-String-0}' AND ssid_name = '%{Tmp-String-1}'}"
                Tmp-String-3 = "%{sql:UPDATE ssids SET last_seen_at = NOW() WHERE controller_id = NULLIF(%{control:Tmp-Integer-0}, 0) AND ssid_name = '%{Tmp-String-1}'}"
            }
        }

        ok
    }
}
