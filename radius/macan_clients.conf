# Dynamic client discovery. Referenced by `dynamic_clients = macan_clients` in
# radius/clients.conf; FreeRADIUS runs this virtual server when a packet arrives
# from an address it has no client entry for.
#
# The request reaching this section is EMPTY — no User-Name, no Calling-Station-Id,
# nothing. Packet-Src-IP-Address is the only usable attribute. Do not try to read
# anything else here.
#
# The controller lookup is character-for-character the same host-or-subnet match
# as radius/default.conf, including the ORDER BY: host rows first (INSTR = 0), then
# the longest prefix, then id. That is what lets one AP carry its own secret while
# the rest of the fleet uses the subnet row's. If the two ever diverge, an AP could
# be admitted with one row's secret and then evaluated against another row's
# controller_id.
#
# No brace quantifier in this file: an unquoted } ends the surrounding %{sql:...}
# expansion and truncates the query mid-string.
server macan_clients {
    authorize {
        update control {
            Tmp-String-0 = "%{sql:SELECT shared_secret FROM controllers WHERE enabled = 1 AND (ip_address = '%{Packet-Src-IP-Address}' OR (INSTR(ip_address, '/') > 0 AND INET_ATON('%{Packet-Src-IP-Address}') >> (32 - SUBSTRING_INDEX(ip_address, '/', -1)) = INET_ATON(SUBSTRING_INDEX(ip_address, '/', 1)) >> (32 - SUBSTRING_INDEX(ip_address, '/', -1)))) ORDER BY INSTR(ip_address, '/') ASC, SUBSTRING_INDEX(ip_address, '/', -1) + 0 DESC, id ASC LIMIT 1}"
        }

        # Not a registered controller, or registered but disabled. Returning
        # anything other than "ok" makes FreeRADIUS discard the packet silently —
        # the same fail-closed outcome as before, and the same as an unknown IP
        # under the old static clients.conf.
        #
        # Nothing is logged to auth_logs from here: this section has no MAC and no
        # SSID to log, and the packet never reaches the `default` server. An
        # unregistered NAS is therefore invisible in the panel. That was already
        # true before dynamic clients — a packet from an unlisted IP was dropped by
        # the socket layer. The "controller tidak dikenal" branch in default.conf
        # still fires for a controller whose row was deleted while its client entry
        # was cached.
        if ("%{control:Tmp-String-0}" == "") {
            reject
        }

        update control {
            &FreeRADIUS-Client-IP-Address = "%{Packet-Src-IP-Address}"
            &FreeRADIUS-Client-Secret = "%{control:Tmp-String-0}"
            &FreeRADIUS-Client-Shortname = "%{Packet-Src-IP-Address}"
            &FreeRADIUS-Client-NAS-Type = "other"
        }

        # Must be the last statement: FreeRADIUS ignores the new client definition
        # unless this section returns "ok".
        ok
    }
}
